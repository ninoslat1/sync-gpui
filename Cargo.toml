[package]
name = "sync-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.9.0"
mysql = "28.0.4"
regex = "1.13.1"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
directories = "6.0.0"
chrono = "0.4.45"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
debug=false
strip="symbols"
lto=true
codegen-units=1
panic="abort"
